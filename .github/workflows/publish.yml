on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for Trusted Publishers.
    environment:
      name: publish
      url: https://pypi.org/project/ghsa-cli
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.14
      - run: |
          python -m pip install \
            -r .github/workflows/publish-requirements.txt
          # Don't install build requirements separately.
          # These are pinned within 'publish-requirements.txt'.
          python -m build \
            --skip-dependency-check \
            --no-isolation
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
